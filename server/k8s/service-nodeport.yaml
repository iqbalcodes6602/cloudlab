apiVersion: apps/v1
kind: Deployment
metadata:
  name: service_name
  labels:
    app: service_name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service_name
  template:
    metadata:
      labels:
        app: service_name
    spec:
      containers:
        - name: workspace
          image: container_image
          ports:
            - containerPort: container_port
          env:
            - name: VNC_PW
              value: service_password
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: service_name
  labels:
    app: service_name
spec:
  type: NodePort
  selector:
    app: service_name
  ports:
    - name: vnc
      port: container_port
      targetPort: container_port
      protocol: TCP
      # nodePort: 0  # Let K8s assign automatically


